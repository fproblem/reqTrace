# Два стенда из одного файла (v1.7.5) — роль машины объявляется в reqtrace/.env:
#   офисный прод-Mac:  COMPOSE_PROFILES=prod    → postgres + backend + frontend (80/443, серты)
#   дев-машина:        строки нет               → только postgres + backend; фронт — npm start
#   смоук прод-сборки: COMPOSE_PROFILES=preview → + frontend-dev (http://localhost:3000, без TLS)
# Подробнее — README, раздел «Полигон и прод».
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reqtrace
      POSTGRES_USER: reqtrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Создайте reqtrace/.env по образцу .env.example}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Только localhost — наружу база не смотрит (доступ для отладки с самого хоста).
      # Порт переопределяется в .env (POSTGRES_HOST_PORT), если 5432 на машине занят.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reqtrace"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      # Только localhost — сотрудники ходят через nginx фронтенда (/api).
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://reqtrace:${POSTGRES_PASSWORD}@postgres:5432/reqtrace
      DATABASE_URL_SYNC: postgresql://reqtrace:${POSTGRES_PASSWORD}@postgres:5432/reqtrace
    depends_on:
      postgres:
        condition: service_healthy

  # Прод-фронт: только офисный Mac (COMPOSE_PROFILES=prod).
  frontend:
    profiles: ["prod"]
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Сертификат reqtrace.surf.dev: fullchain.pem + privkey.pem (не в git).
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend

  # Смоук прод-сборки на дев-машине (COMPOSE_PROFILES=preview): тот же образ,
  # но http-конфиг nginx волюмом поверх прод-конфига — без сертов и редиректа.
  frontend-dev:
    profiles: ["preview"]
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
