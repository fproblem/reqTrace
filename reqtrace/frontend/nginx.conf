# HTTP: только редирект на HTTPS — Google-вход не работает с http-origin.
server {
    listen 80;
    server_name _;
    return 301 https://reqtrace.surf.dev$request_uri;
}

server {
    listen 443 ssl;
    server_name reqtrace.surf.dev;

    # Сертификаты монтируются volume'ом из reqtrace/certs/ (см. docker-compose.yml).
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
