# Дев-вариант конфига (профиль preview в docker-compose.yml): прод-сборка
# фронтенда по http на localhost, без TLS и без редиректа на прод-домен.
# В образ НЕ печётся — монтируется волюмом поверх прод-конфига.
# Прод-вариант (80→https-редирект + 443 ssl) — соседний nginx.conf.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location ^~ /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
